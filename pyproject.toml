[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edgar-ratios"
version = "2.0.1"
description = "Financial ratios straight from SEC filings: type a ticker, get 23 ratios over five years, every number traced to the 10-K it came from."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Owen Alderson" }]
keywords = ["sec", "edgar", "xbrl", "financial-ratios", "10-k", "fundamentals", "valuation", "claude"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "rich>=13",
    "certifi",
    "anthropic>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
edgar-ratios = "edgar_ratios.__main__:run"

[project.urls]
Homepage = "https://github.com/owen-alderson/edgar-ratios"

[tool.hatch.build.targets.sdist]
exclude = ["docs/*.gif", "docs/*.png", ".claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
